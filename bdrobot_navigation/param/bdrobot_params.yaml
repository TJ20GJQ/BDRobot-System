controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters 
    progress_checker:  # 监控机器人在导航过程中的移动进度，判断是否陷入停滞状态
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1  # 机器人必须移动的最小距离
      movement_time_allowance: 60.0  # 允许完成移动的最长时间
    # Goal checker parameters
    general_goal_checker:  # 在导航过程中持续检查机器人当前位姿是否满足到达目标的条件
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.02  # 机器人位置与目标位置的允许偏差(m)  TODO:提高精度
      yaw_goal_tolerance: 0.02  # 机器人朝向与目标朝向的允许偏差(rad)
      stateful: True  # 启用两阶段检查（先位置后角度）
    # DWB holonomic (全向轮) 参数
    FollowPath:
      # plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # # 1. 【关键】开启全向模式（4WID-4WIS 必开）
      # enable_holonomic: true
      # # 2. 前瞻距离（决定顺滑度，速度越高值越大）
      # lookahead_dist: 0.6
      # min_lookahead_dist: 0.3
      # max_lookahead_dist: 1.2
      # lookahead_time: 0.7
      # use_velocity_scaled_lookahead: true  # 速度自适应前瞻，转弯更自然
      # # 3. 速度约束（根据你的底盘性能修改，数值越小越丝滑）
      # max_vel: 1.8
      # min_vel: 0.0
      # max_vel_x: 1.8
      # min_vel_x: -1.8
      # max_vel_y: 1.8    # 横向最大速度，控制横移幅度，避免抖动
      # min_vel_y: -1.8
      # max_vel_theta: 1.0
      # # 4. 加减速约束（轨迹丝滑核心，严格限制突变）
      # acc_lim_x: 0.4
      # decel_lim_x: 0.4
      # acc_lim_y: 0.3    # 横向加速度一定要偏小，全向底盘易抖
      # decel_lim_y: 0.3
      # acc_lim_theta: 0.6
      # decel_lim_theta: 0.6
      # # 5. 曲率/转向约束（防止急转弯、轨迹折线）
      # max_curvature: 2.0
      # max_angular_accel: 1.5
      # # 6. 路径跟踪权重（优先贴紧全局路径）
      # path_heading_weight: 0.15
      # path_length_weight: 0.0
      # # 7. 倒车、末端减速配置
      # allow_reversing: true
      # slowdown_when_curved: true       # 弯道自动降速，大幅提升顺滑度
      # curvature_velocity_scaling_factor: 0.6
      # # 8. 路径过滤（过滤局部杂点，轨迹更平滑）
      # use_path_orientations: true
      # transform_tolerance: 0.3

      # plugin: "dwb_core::DWBLocalPlanner"
      # debug_trajectory_details: True
      # min_vel_x: -1.8
      # min_vel_y: -1.8                         # 全向：允许负向横向平移
      # max_vel_x: 1.8
      # max_vel_y: 1.8                          # 全向：允许正向横向平移
      # max_vel_theta: 1.0                      # 全向：允许正向旋转速度
      # min_speed_xy: 0.0
      # max_speed_xy: 1.8                       # XY 合成速度上限
      # min_speed_theta: 0.0
      # acc_lim_x: 0.5
      # acc_lim_y: 0.5                          # 全向：横向加速度
      # acc_lim_theta: 1.0
      # decel_lim_x: -0.5
      # decel_lim_y: -0.5                       # 全向：横向减速度
      # decel_lim_theta: -1.0
      # vx_samples: 20
      # vy_samples: 20                          # 全向：对横向速度也采样
      # vtheta_samples: 20
      # sim_time: 0.6
      
      # # linear_granularity: 0.05  # 线性速度采样的分辨率
      # # angular_granularity: 0.025  # 角度速度采样的分辨率
      # transform_tolerance: 1.2  # 坐标变换（TF）的时间容差，允许使用最长 1.2 秒之前的变换数据
      # xy_goal_tolerance: 0.05  # 局部规划器的位置到达容忍度(m)
      # trans_stopped_velocity: 0.001  # 判定机器人是否停止的线速度阈值
      # short_circuit_trajectory_evaluation: True  # 启用轨迹评估短路优化，在评估候选轨迹时，如果某条轨迹在早期评估中得分很差，可以提前终止评估
      # stateful: True  # 分阶段检查到达条件：先检查位置，位置到达后再检查角度
      # critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle.scale: 0.04
      # PathAlign.scale: 50.0
      # GoalAlign.scale: 10.0
      # PathAlign.forward_point_distance: 0.1
      # GoalAlign.forward_point_distance: 0.1
      # PathDist.scale: 50.0
      # GoalDist.scale: 10.0
      # RotateToGoal.scale: 32.0
      # RotateToGoal.slowing_factor: 5.0
      # RotateToGoal.lookahead_time: -1.0

      # ====== TEB 专用参数 ======
      plugin: "teb_local_planner::TebLocalPlannerROS"
      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: True  # 是否使用全局路径中每个路径点的朝向信息
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0  # 控制 TEB 规划器向前看多远的全局路径
      global_plan_viapoint_sep: -1.0  # 全局路径途经点采样间隔，-1不再跟踪全局路径的中间点
      global_plan_prune_distance: 1.0  # 控制 TEB 规划器裁剪掉机器人后方多远的全局路径
      exact_arc_length: False
      feasibility_check_no_poses: 5  # 每隔多少个轨迹点进行一次可行性检查
      publish_feedback: False
      # Robot  
      max_vel_x: 1.5
      max_vel_x_backwards: 1.5
      max_vel_y: 1.0
      max_vel_theta: 1.0
      acc_lim_x: 0.3
      acc_lim_y: 0.2
      acc_lim_theta: 0.4
      min_turning_radius: 0.0 # omni-drive robot (can turn on place!)
      footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
        type: "point"
      # GoalTolerance
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      free_goal_vel: False  # 到达目标点时是否允许有非零速度
      complete_global_plan: True  # 是否需要完成整个全局路径才能认为导航完成
      # Obstacles
      min_obstacle_dist: 0.5  # This value must also include our robot radius, since footprint_model is set to "point".
      inflation_dist: 0.6
      include_costmap_obstacles: True  # 是否将动态障碍物预测为速度模型
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15
      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: True 
      costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"  # 用线段表示障碍物边界
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5
      # Optimization
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 2.0
      weight_max_vel_y: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_y: 1.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 1.0  # 惩罚违反非完整运动学约束的轨迹 WE HAVE A HOLONOMIC ROBOT, JUST ADD A SMALL PENALTY
      weight_kinematics_forward_drive: 1.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0  # must be > 0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 10.0 # not in use yet
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 1.0  # 控制 TEB 规划器贴近全局路径途经点的程度
      weight_adapt_factor: 2.0
      # Homotopy Class Planner
      enable_homotopy_class_planning: True
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 1.0
      selection_prefer_initial_plan: 0.9
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: False  # 控制在选择最优路径时是否考虑轨迹的时间代价
      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0
      # Recovery
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

